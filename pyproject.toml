[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nimea_robot"
version = "0.1.0"
description = "Nimea: robot de compañía para personas mayores sobre Reachy Mini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
]
keywords = ["reachy-mini-app"]

[project.optional-dependencies]
robot = ["reachy-mini>=1.13", "faster-whisper>=1.0"]
palabra = ["openwakeword>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
nimea-consola = "nimea_robot.consola:main"

[project.entry-points."reachy_mini_apps"]
nimea = "nimea_robot.main:NimeaApp"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nimea_robot*"]

[tool.setuptools.package-data]
nimea_robot = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
